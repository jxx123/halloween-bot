<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO101 Robot Console</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --edge:#30363d; --txt:#e6edf3; --dim:#8b949e;
          --accent:#2f81f7; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.45 ui-sans-serif, system-ui, sans-serif; height:100vh;
         display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px;
           border-bottom:1px solid var(--edge); background:var(--panel); }
  header h1 { font-size:16px; margin:0; }
  #dot { width:10px; height:10px; border-radius:50%; background:var(--err); }
  #dot.on { background:var(--ok); }
  header .spacer { flex:1; }
  select, button, input {
    background:#21262d; color:var(--txt); border:1px solid var(--edge);
    border-radius:6px; padding:6px 10px; font:inherit; }
  button:hover { border-color:var(--accent); cursor:pointer; }
  a.facelink { color:var(--accent); text-decoration:none; }
  main { flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px; min-height:0; }
  .cams { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .cam { background:var(--panel); border:1px solid var(--edge); border-radius:8px;
         padding:8px; flex:1; display:flex; flex-direction:column; min-height:0; }
  .cam .label { color:var(--dim); font-size:12px; margin-bottom:6px; }
  .cam img { width:100%; flex:1; object-fit:contain; min-height:0; background:#000; border-radius:4px; }
  .right { display:flex; flex-direction:column; gap:12px; min-height:0; }
  #joints { background:var(--panel); border:1px solid var(--edge); border-radius:8px;
            padding:8px 12px; font-size:11px; color:var(--dim);
            display:grid; grid-template-columns:repeat(6, 1fr); gap:4px 10px; }
  #joints b { color:var(--txt); font-weight:600; }
  .chat { background:var(--panel); border:1px solid var(--edge); border-radius:8px;
          flex:1; display:flex; flex-direction:column; min-height:0; }
  #feed { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:92%; padding:7px 11px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
  .user    { align-self:flex-end; background:#1f3a5f; }
  .say     { align-self:flex-start; background:#238636; }
  .thought { align-self:flex-start; background:transparent; color:var(--dim);
             font-style:italic; font-size:12px; padding:2px 11px; }
  .action  { align-self:flex-start; background:#21262d; color:var(--warn);
             font-family:ui-monospace, monospace; font-size:12px; }
  .status  { align-self:center; color:var(--dim); font-size:11px; }
  .status.err { color:var(--err); }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid var(--edge); }
  #simbadge { background:var(--warn); color:#000; font-weight:700; font-size:11px;
              padding:2px 7px; border-radius:4px; letter-spacing:.5px; }
  #policy { background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:8px 12px;
            display:flex; flex-direction:column; gap:6px; }
  #policy .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #policy #ptask { flex:1; min-width:200px; }
  #pstatus { color:var(--dim); font-size:12px; font-family:ui-monospace, monospace; }
  #pstatus.run { color:var(--ok); }
  #pstatus.err { color:var(--err); }
  form input { flex:1; }
</style>
</head>
<body>
<header>
  <div id="dot"></div>
  <h1>🤖 SO101 Robot Console</h1>
  <span id="simbadge" hidden title="MuJoCo twin — same API as the real robot">SIM</span>
  <div class="spacer"></div>
  <button id="host" title="start robot host mode: face ears on + motion reactions">▶ start</button>
  <button id="teleop" title="mirror the leader arms onto the followers">🕹 teleop: …</button>
  <label>agent <select id="agent"></select></label>
  <a class="facelink" href="/face" target="_blank">🙂 robot face</a>
  <a class="facelink" href="/face?theme=halloween" target="_blank">🎃</a>
</header>
<main>
  <div class="cams">
    <div style="display:flex; gap:12px; flex:1.3; min-height:0">
      <div class="cam"><div class="label">overhead</div>
        <img data-stream="overhead" onerror="this.alt='robot server offline'"></div>
      <div class="cam" id="scenecam" hidden><div class="label">sim scene — third-person view</div>
        <img id="sceneimg"></div>
    </div>
    <div style="display:flex; gap:12px; flex:1; min-height:0">
      <div class="cam"><div class="label">left wrist — orange arm</div>
        <img data-stream="left_wrist" onerror="this.alt='robot server offline'"></div>
      <div class="cam"><div class="label">right wrist — blue arm</div>
        <img data-stream="right_wrist" onerror="this.alt='robot server offline'"></div>
    </div>
  </div>
  <div class="right">
    <div id="joints">robot state: connecting…</div>
    <div id="policy">
      <div class="row">
        <b title="π₀-FAST SO101 bimanual checkpoint, served on the 5090">π₀-FAST</b>
        <input id="ptask" value="Grasp the toy and place it in the basket." title="task prompt">
        <label><input id="psecs" type="number" value="30" min="1" max="300" style="width:64px"> s</label>
        <label id="plockwrap" hidden title="pause physics while the policy thinks (sim only)">
          <input id="plock" type="checkbox"> lockstep</label>
        <button id="prun">▶ run π</button>
        <button id="pstop">■ stop</button>
        <button id="sreset" hidden title="arms to rest pose, toys back in place">⟲ reset</button>
        <button id="sshuffle" hidden title="reset with toys at random spots">🎲 shuffle</button>
      </div>
      <div id="pstatus">policy: …</div>
    </div>
    <div class="chat">
      <div id="feed"></div>
      <form id="f">
        <input id="text" placeholder="Tell the robot what to do… e.g. 'look at the basket and describe what you see'" autocomplete="off">
        <button>Send</button>
      </form>
    </div>
  </div>
</main>
<script>
// camera streams come from the robot server on the same host as this page
document.querySelectorAll('img[data-stream]').forEach(i =>
  i.src = `http://${location.hostname}:8399/stream?name=${i.dataset.stream}`);

const feed = document.getElementById('feed');
const agentSel = document.getElementById('agent');

fetch('/api/agents').then(r=>r.json()).then(d=>{
  for (const a of d.agents) {
    const o = document.createElement('option'); o.value = o.textContent = a; agentSel.append(o);
  }
  agentSel.value = localStorage.agent || 'claude';
});
agentSel.onchange = () => localStorage.agent = agentSel.value;

function add(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  feed.append(div);
  feed.scrollTop = feed.scrollHeight;
}

const es = new EventSource('/events');
es.onopen = () => document.getElementById('dot').classList.add('on');
es.onerror = () => document.getElementById('dot').classList.remove('on');
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'user') add('user', ev.text);
  else if (ev.type === 'say') add('say', ev.text);
  else if (ev.type === 'thought') add('thought', ev.text);
  else if (ev.type === 'action') add('action', '⚙ ' + ev.text);
  else if (ev.type === 'status') add('status' + (String(ev.text).startsWith('error') ? ' err' : ''), ev.text);
};

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('text');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const r = await fetch('/instruct', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text, agent: agentSel.value }) });
  if (!r.ok) add('status err', (await r.json()).error || 'request failed');
};

const hostBtn = document.getElementById('host');
let hostOn = false;
function renderHost() {
  hostBtn.textContent = hostOn ? '⏸ stop' : '▶ start';
  hostBtn.style.borderColor = hostOn ? 'var(--ok)' : 'var(--edge)';
  hostBtn.style.color = hostOn ? 'var(--ok)' : 'var(--txt)';
}
renderHost();
hostBtn.onclick = async () => {
  hostBtn.disabled = true;
  try {
    const r = await (await fetch('/api/host', { method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ enabled: !hostOn }) })).json();
    if (r.ok) { hostOn = r.on; renderHost(); }
  } finally { hostBtn.disabled = false; }
};
setInterval(async () => {
  try {
    const r = await (await fetch('/api/host')).json();
    if (r.ok && r.on !== hostOn) { hostOn = r.on; renderHost(); }
  } catch {}
}, 3000);

const teleopBtn = document.getElementById('teleop');
let teleopOn = false;
function renderTeleop() {
  teleopBtn.textContent = teleopOn ? '🕹 teleop: ON' : '🕹 teleop: off';
  teleopBtn.style.borderColor = teleopOn ? 'var(--ok)' : 'var(--edge)';
  teleopBtn.style.color = teleopOn ? 'var(--ok)' : 'var(--txt)';
}
renderTeleop();
teleopBtn.onclick = async () => {
  if (!teleopOn && !confirm('Teleop ON: the follower arms will immediately move to match ' +
      'the leader arms. Hold the leaders in a safe pose. Continue?')) return;
  teleopBtn.disabled = true;
  try {
    const r = await (await fetch('/api/teleop', { method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ enabled: !teleopOn }) })).json();
    if (r.ok) { teleopOn = r.enabled; renderTeleop(); }
    else add('status err', r.error || 'teleop toggle failed');
  } finally { teleopBtn.disabled = false; }
};

const pstatus = document.getElementById('pstatus');
let simMode = null;
function renderSim(sim) {
  if (sim === simMode) return;
  simMode = sim;
  document.getElementById('simbadge').hidden = !sim;
  document.getElementById('scenecam').hidden = !sim;
  document.getElementById('plockwrap').hidden = !sim;
  document.getElementById('sreset').hidden = !sim;
  document.getElementById('sshuffle').hidden = !sim;
  teleopBtn.hidden = sim;
  const scene = document.getElementById('sceneimg');
  scene.src = sim ? `http://${location.hostname}:8399/stream?name=scene` : '';
}
function renderPolicy(p) {
  const run = document.getElementById('prun');
  if (!p) {
    pstatus.textContent = 'policy: not wired on this robot server yet';
    pstatus.className = ''; run.disabled = true; return;
  }
  run.disabled = p.running;
  let t = `policy: ${p.phase}`;
  if (p.task && p.phase !== 'idle') t += ` · "${p.task}" · ${p.elapsed_s}/${p.seconds}s · ${p.executed} actions · ${p.chunks} chunks`;
  if (p.last_latency_s) t += ` · inference ${p.last_latency_s}s`;
  if (p.lockstep && p.running) t += ' · lockstep';
  if (p.error) t += ` · ${p.error}`;
  if (p.phase === 'loading') t += ' (loading the model on the GPU, ~50 s the first time)';
  pstatus.textContent = t;
  pstatus.className = p.phase === 'error' ? 'err' : (p.running ? 'run' : '');
}
async function policyPost(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'},
                                body: JSON.stringify(body || {}) });
  const d = await r.json();
  if (!r.ok || d.ok === false) add('status err', d.error || `${path} failed`);
  pollState();
}
document.getElementById('prun').onclick = () => policyPost('/api/policy', {
  task: document.getElementById('ptask').value.trim(),
  seconds: Number(document.getElementById('psecs').value) || 30,
  lockstep: document.getElementById('plock').checked });
document.getElementById('pstop').onclick = () => policyPost('/api/policy/stop');
document.getElementById('sreset').onclick = () => policyPost('/api/sim/reset', { randomize: false });
document.getElementById('sshuffle').onclick = () => policyPost('/api/sim/reset', { randomize: true });

async function pollState() {
  try {
    const d = await (await fetch('/api/state')).json();
    if (d.ok) {
      renderSim(!!d.sim);
      renderPolicy(d.policy);
      const j = document.getElementById('joints');
      j.innerHTML = Object.entries(d.positions)
        .map(([k,v]) => `<span>${k.replace('.pos','').replace(/_/g,' ')}<br><b>${v.toFixed(1)}</b></span>`).join('');
      if (typeof d.teleop === 'boolean' && d.teleop !== teleopOn) { teleopOn = d.teleop; renderTeleop(); }
    } else throw 0;
  } catch { document.getElementById('joints').textContent = 'robot state: server offline (python ctl.py start)'; }
}
setInterval(pollState, 1000); pollState();
</script>
</body>
</html>
